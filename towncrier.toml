[tool.towncrier]
package = "vimseo"
directory = "changelog/fragments"
filename = "CHANGELOG.md"
template = "changelog/template.jinja2"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "# Version {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/vimseo/vimseo/pull/{issue})"
underlines = [""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
